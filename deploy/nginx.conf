# /etc/nginx/sites-available/diamantairelille.co
# Symlink: ln -sf /etc/nginx/sites-available/diamantairelille.co /etc/nginx/sites-enabled/
# Test:    nginx -t && systemctl reload nginx

# Force HTTP -> HTTPS (Cloudflare termine déjà le TLS public, mais on garde un redirect interne propre)
server {
    listen 80;
    listen [::]:80;
    server_name diamantairelille.co www.diamantairelille.co;

    # Let's Encrypt challenge si SSL local (sinon Cloudflare Origin Cert)
    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }

    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name diamantairelille.co www.diamantairelille.co;

    # === SSL ===
    # Cloudflare Origin Certificate (recommandé) ou Let's Encrypt
    ssl_certificate     /etc/ssl/cloudflare/diamantairelille.co.pem;
    ssl_certificate_key /etc/ssl/cloudflare/diamantairelille.co.key;

    # === Cloudflare Authenticated Origin Pulls (optionnel mais fortement conseillé) ===
    # ssl_client_certificate /etc/ssl/cloudflare/origin-pull-ca.pem;
    # ssl_verify_client on;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # === Sécurité headers (Next.js ajoute déjà certains, on complète) ===
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    client_max_body_size 16M;
    proxy_read_timeout 60s;

    # === Proxy Next.js (port 3000 via PM2) ===
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Cache statique Next.js
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    location /photos/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }
}
